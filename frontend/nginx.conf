server {
    listen 80;

    # 1. Frontend: Serve React and handle client-side routing
    location / {
        root /usr/share/nginx/html;
        index index.html;
        # Essential for React Router to work on refresh
        try_files $uri $uri/ /index.html;
    }

    # 2. Backend API: Proxy all /api/ calls to the backend service
    location /api/ {
    # Remove the trailing slash from the URL to pass the path correctly
    proxy_pass http://backend:8000; 
    
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}


    # 3. Real-time: Socket.io support
    location /socket.io/ {
    proxy_pass http://backend:8000/socket.io/;

    proxy_http_version 1.1;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";

    proxy_set_header Host $host;
 	proxy_read_timeout 86400;
    proxy_send_timeout 86400;
    proxy_cache_bypass $http_upgrade;
}
    # 4. Auth: Google Login proxy
    location /google_login {
        proxy_pass http://backend:8000/google_login;
        proxy_set_header Host $host;
    }

    # DELETE the "location /login/" block entirely. 
    # It is redundant and causes the 404 you see in the console.
}
